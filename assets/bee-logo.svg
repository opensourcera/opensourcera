<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="opensourcera bee logo">
  <title>opensourcera bee</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <!-- background disc -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <g fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">

    <!-- dotted flight trail: a loop that leads into the bee -->
    <path d="M 62 418 C 70 350 128 332 150 372 C 170 410 128 446 100 420 C 72 394 96 350 134 338 C 160 330 170 318 174 306"
          stroke-dasharray="1 20" stroke-width="9"/>

    <!-- wings -->
    <path d="M 282 236 C 246 150 300 112 334 156 C 350 180 324 226 286 236 Z" stroke-width="8"/>
    <path d="M 298 232 C 318 140 398 126 404 176 C 408 214 348 240 298 232 Z"/>

    <!-- body -->
    <ellipse cx="305" cy="292" rx="96" ry="62"/>

    <!-- stripes -->
    <path d="M 270 234 Q 258 292 270 350"/>
    <path d="M 305 231 Q 293 292 305 353"/>
    <path d="M 340 236 Q 330 292 340 348"/>

    <!-- stinger -->
    <path d="M 400 284 L 434 292 L 400 300"/>

    <!-- legs -->
    <path d="M 266 348 q -6 20 -22 30"/>
    <path d="M 302 354 q 0 20 -12 32"/>
    <path d="M 338 348 q 6 20 22 28"/>

    <!-- head -->
    <circle cx="178" cy="284" r="34"/>

    <!-- antennae -->
    <path d="M 165 254 Q 150 218 124 206"/>
    <path d="M 182 252 Q 184 212 164 194"/>
  </g>

  <!-- antenna tips and eye -->
  <g fill="#38bdf8">
    <circle cx="120" cy="204" r="7"/>
    <circle cx="160" cy="192" r="7"/>
    <circle cx="188" cy="274" r="6"/>
  </g>

  <!-- accent: warm amber stripe fill highlight -->
  <g fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <path d="M 287 236 Q 276 292 287 348"/>
    <path d="M 322 233 Q 311 292 322 351"/>
  </g>
</svg>
